<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aday Profili</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(225, 27, 58, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-16">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <span class="text-base font-bold text-gray-900">Kariyer Platformu</span>
            <button id="logoutBtn" class="text-sm font-medium text-[#e11b3a] hover:text-[#c51631] px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">
                Çıkış Yap
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 pt-8 space-y-6">

        <!-- Yükleniyor -->
        <div id="loadingState" class="text-center py-16">
            <svg class="animate-spin w-8 h-8 text-[#e11b3a] mx-auto" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <p class="text-sm text-gray-500 mt-3">Profil yükleniyor...</p>
        </div>

        <!-- Alert -->
        <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium border"></div>

        <!-- Profil içeriği -->
        <div id="profileContainer" class="hidden space-y-6">

            <!-- Karşılama -->
            <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-gray-900" id="welcomeText">Merhaba</h1>
                    <p class="text-sm text-gray-500 mt-1" id="applicantEmail"></p>
                </div>
                <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-100">
                    Doğrulanmış
                </span>
            </div>

            <!-- Profil Düzenleme Formu -->
            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wider">Profil Bilgileriniz</h2>
                    <button id="editToggleBtn" onclick="toggleEdit()"
                        class="text-xs font-semibold text-[#e11b3a] hover:text-[#c51631] px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">
                        Düzenle
                    </button>
                </div>

                <form id="profileForm" class="px-6 py-5 space-y-4">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Ad</label>
                            <input type="text" id="firstName" disabled
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 bg-gray-50 disabled:opacity-60 transition-all focus:border-[#e11b3a]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Soyad</label>
                            <input type="text" id="lastName" disabled
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 bg-gray-50 disabled:opacity-60 transition-all focus:border-[#e11b3a]">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1.5">Üniversite</label>
                        <input type="text" id="university" disabled
                            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 bg-gray-50 disabled:opacity-60 transition-all focus:border-[#e11b3a]">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Bölüm</label>
                            <input type="text" id="uniDepartment" disabled
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 bg-gray-50 disabled:opacity-60 transition-all focus:border-[#e11b3a]">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Mezuniyet Yılı</label>
                            <input type="number" id="gradYear" disabled min="2000" max="2035"
                                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 bg-gray-50 disabled:opacity-60 transition-all focus:border-[#e11b3a]">
                        </div>
                    </div>

                    <!-- Kaydet butonu — düzenleme modunda görünür -->
                    <div id="saveSection" class="hidden pt-2 flex gap-3">
                        <button type="button" onclick="cancelEdit()"
                            class="flex-1 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition-colors">
                            İptal
                        </button>
                        <button type="button" onclick="saveProfile()"
                            id="saveBtn"
                            class="flex-2 flex-grow py-2.5 bg-[#e11b3a] hover:bg-[#c51631] text-white font-semibold rounded-xl text-sm transition-all">
                            Değişiklikleri Kaydet
                        </button>
                    </div>

                </form>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wider">Başvuru Durumunuz</h2>
                </div>
                <div class="px-6 py-5">
                    <div id="noApplicationState" class="hidden text-center py-6 text-sm text-gray-400">
                        Henüz yapılmış bir başvuru kaydınız bulunmamaktadır.
                    </div>
                    <div id="applicationsList" class="space-y-3"></div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const BASE_URL = "http://localhost:8000";
        const token = localStorage.getItem("auth_token");
        let originalData = {};
        let candidateId = null;

        if (!token) {
            window.location.href = "/static/index.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "/static/index.html";
        });

        function showAlert(message, type = "error") {
            const box = document.getElementById("alertBox");
            box.className = "p-4 rounded-xl text-sm font-medium border";
            if (type === "error") {
                box.classList.add("bg-red-50", "text-red-700", "border-red-200");
            } else {
                box.classList.add("bg-emerald-50", "text-emerald-700", "border-emerald-200");
            }
            box.textContent = message;
            box.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function hideAlert() {
            document.getElementById("alertBox").className = "hidden";
        }

        // --- Düzenleme Modu ---
        function toggleEdit() {
            const inputs = ["firstName", "lastName", "university", "uniDepartment", "gradYear"];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = false;
                el.classList.remove("bg-gray-50", "opacity-60");
                el.classList.add("bg-white");
            });
            document.getElementById("saveSection").classList.remove("hidden");
            document.getElementById("editToggleBtn").classList.add("hidden");
        }

        function cancelEdit() {
            // Orijinal verileri geri yükle
            document.getElementById("firstName").value = originalData.first_name || "";
            document.getElementById("lastName").value = originalData.last_name || "";
            document.getElementById("university").value = originalData.university || "";
            document.getElementById("uniDepartment").value = originalData.university_department || "";
            document.getElementById("gradYear").value = originalData.graduation_year || "";

            const inputs = ["firstName", "lastName", "university", "uniDepartment", "gradYear"];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = true;
                el.classList.add("bg-gray-50", "opacity-60");
                el.classList.remove("bg-white");
            });
            document.getElementById("saveSection").classList.add("hidden");
            document.getElementById("editToggleBtn").classList.remove("hidden");
            hideAlert();
        }

        async function saveProfile() {
            const saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;
            saveBtn.textContent = "Kaydediliyor...";
            hideAlert();

            const payload = {
                first_name: document.getElementById("firstName").value.trim(),
                last_name: document.getElementById("lastName").value.trim(),
                university: document.getElementById("university").value.trim() || null,
                university_department: document.getElementById("uniDepartment").value.trim() || null,
                graduation_year: document.getElementById("gradYear").value ? parseInt(document.getElementById("gradYear").value) : null
            };

            try {
                const res = await fetch(`${BASE_URL}/applicants/${candidateId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Güncelleme başarısız.");
                }

                const updated = await res.json();
                originalData = updated;
                showAlert("Profiliniz başarıyla güncellendi.", "success");
                cancelEdit();

            } catch (error) {
                showAlert(error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Değişiklikleri Kaydet";
            }
        }

        // --- Veri Çekme ---
        const statusConfig = {
            "applied":      { label: "Yeni Başvuru",  cls: "bg-blue-50 text-blue-700 border-blue-200" },
            "under_review": { label: "İncelemede",    cls: "bg-amber-50 text-amber-700 border-amber-200" },
            "accepted":     { label: "Kabul Edildi",  cls: "bg-emerald-50 text-emerald-700 border-emerald-200" },
            "rejected":     { label: "Reddedildi",    cls: "bg-red-50 text-red-700 border-red-200" },
            "pending":      { label: "Beklemede",     cls: "bg-gray-50 text-gray-700 border-gray-200" }
        };

        async function fetchProfile() {
            try {
                const res = await fetch(`${BASE_URL}/applicants/me`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Profil yüklenemedi.");

                const data = await res.json();
                originalData = data;
                candidateId = data.id;

                // Karşılama
                document.getElementById("welcomeText").textContent = `Merhaba, ${data.first_name} ${data.last_name}`;
                document.getElementById("applicantEmail").textContent = data.email;

                // Form alanları
                document.getElementById("firstName").value = data.first_name || "";
                document.getElementById("lastName").value = data.last_name || "";
                document.getElementById("university").value = data.university || "";
                document.getElementById("uniDepartment").value = data.university_department || "";
                document.getElementById("gradYear").value = data.graduation_year || "";

                // Başvurular
                const appList = document.getElementById("applicationsList");
                    appList.innerHTML = ""; // 🌟 Her yüklemede listeyi temizle ki mükerrer binmesin

                    if (!data.applications || data.applications.length === 0) {
                        document.getElementById("noApplicationState").classList.remove("hidden");
                    } else {
                        document.getElementById("noApplicationState").classList.add("hidden"); // Koru
                        data.applications.forEach(app => {
                            // 🌟 Gelen statüyü küçük harfe çevirerek aratıyoruz (Harf hatalarını engellemek için)
                            const currentStatus = app.status ? app.status.toLowerCase() : "pending";
                            const sc = statusConfig[currentStatus] || { label: app.status || "Beklemede", cls: "bg-gray-100 text-gray-600 border-gray-200" };
        
                            const date = app.created_at ? new Date(app.created_at).toLocaleDateString("tr-TR") : "-";
                            const card = document.createElement("div");
                            card.className = "flex items-center justify-between p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-gray-300 transition-all";
                            card.innerHTML = `
                                <div>
                                    <p class="font-semibold text-gray-800 text-sm">${app.position}</p>
                                    <p class="text-xs text-gray-400 mt-0.5">${date} • ${app.department || 'Genel'}</p>
                                </div>
                                <span class="text-xs font-semibold px-3 py-1 rounded-full border ${sc.cls}">${sc.label}</span>
                            `;
                            appList.appendChild(card);
                        });
                }

                document.getElementById("loadingState").classList.add("hidden");
                document.getElementById("profileContainer").classList.remove("hidden");

            } catch (error) {
                localStorage.clear();
                window.location.href = "/static/index.html";
            }
        }

        window.addEventListener("DOMContentLoaded", fetchProfile);
    </script>

</body>
</html>
