<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aday Profil Sayfası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 mb-8 sticky top-0 z-40 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <span class="text-lg font-bold text-gray-900 tracking-tight">Kariyer Platformu</span>
            <button id="logoutBtn" class="text-sm font-medium text-[#e11b3a] hover:text-[#c51631] transition-colors">
                Oturumu Kapat
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 space-y-6">
        
        <div id="loadingState" class="text-center py-12 space-y-4">
            <svg class="animate-spin w-8 h-8 text-[#e11b3a] mx-auto" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <p class="text-sm text-gray-500">Profil bilgileriniz güvenli katmandan yükleniyor...</p>
        </div>

        <div id="profileContainer" class="hidden space-y-6">
            
            <div class="bg-white border border-gray-200 rounded-2xl p-6 md:p-8 shadow-sm flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 tracking-tight" id="welcomeText">Merhaba, </h1>
                    <p class="text-sm text-gray-500 mt-1" id="applicantEmail"></p>
                </div>
                <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-100">
                    Hesap Doğrulanmış
                </span>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
                <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b border-gray-100 pb-2">Eğitim Bilgileriniz</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                    <div>
                        <span class="block text-xs font-medium text-gray-400">Üniversite</span>
                        <span class="font-semibold text-gray-800" id="displayUniversity">-</span>
                    </div>
                    <div>
                        <span class="block text-xs font-medium text-gray-400">Bölüm</span>
                        <span class="font-semibold text-gray-800" id="displayDepartment">-</span>
                    </div>
                    <div>
                        <span class="block text-xs font-medium text-gray-400">Mezuniyet Yılı</span>
                        <span class="font-semibold text-gray-800" id="displayGradYear">-</span>
                    </div>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
                <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wider border-b border-gray-100 pb-2">Mevcut Başvurularınız</h2>
                <div id="noApplicationState" class="hidden text-center py-6 text-sm text-gray-500">
                    Henüz aktif bir iş başvurunuz bulunmamaktadır.
                </div>
                <div id="applicationCard" class="bg-gray-50 border border-gray-200 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h3 class="font-bold text-gray-900" id="appPosition">-</h3>
                        <p class="text-xs text-gray-400 mt-0.5" id="appDate">Başvuru Tarihi: -</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-semibold px-3 py-1.5 rounded-xl border" id="appStatus">-</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const BASE_URL = "http://localhost:8000";
        const token = localStorage.getItem("auth_token");

        if (!token) {
            window.location.href = "/static/index.html";
        }

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "/static/index.html";
        });

        async function fetchProfileData() {
            try {
                // 1. Aday Profil Bilgilerini Çek
                const profileRes = await fetch(`${BASE_URL}/applicants/me`, { 
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!profileRes.ok) {
                    throw new Error("Profil bilgileri yüklenemedi.");
                }

                const applicant = await profileRes.json();
                
                // Arayüzü Doldur
                document.getElementById("welcomeText").textContent = `Merhaba, ${applicant.first_name} ${applicant.last_name}`;
                document.getElementById("applicantEmail").textContent = applicant.email;
                document.getElementById("displayUniversity").textContent = applicant.university || "-";
                document.getElementById("displayDepartment").textContent = applicant.university_department || "-";
                document.getElementById("displayGradYear").textContent = applicant.graduation_year || "-";

                // 2. Başvuru Bilgilerini Çek (Geliştirme aşamasına uygun statik/dinamik fallback)
                // İleride buraya /applications/me endpoint'i gelecek. Şimdilik İK listesinden simüle edilebilir.
                document.getElementById("appPosition").textContent = "Yazılım Geliştirme Pozisyonu";
                document.getElementById("appDate").textContent = `Kayıt No: #${applicant.id}`;
                
                const statusBadge = document.getElementById("appStatus");
                statusBadge.textContent = "İncelemede";
                statusBadge.className = "text-xs font-semibold px-3 py-1.5 rounded-xl border bg-blue-50 text-blue-700 border-blue-100";

                // Konteynerları Değiştir
                document.getElementById("loadingState").classList.add("hidden");
                document.getElementById("profileContainer").classList.remove("hidden");

            } catch (error) {
                console.error(error);
                localStorage.clear();
                window.location.href = "/static/index.html";
            }
        }

        // Sayfa yüklendiğinde tetikle
        window.addEventListener("DOMContentLoaded", fetchProfileData);
    </script>
</body>
</html>
