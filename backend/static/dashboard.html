<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İK Yönetim Paneli - Başvurular</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <div id="authGate" class="hidden fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-gray-200 p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6 relative overflow-hidden">
            
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#e11b3a] to-[#c51631]"></div>

            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight">İK Yönetim Paneli</h2>
                <p class="text-xs text-gray-500 mt-1">Lütfen kurumsal kullanıcı bilgilerinizle giriş yapın.</p>
            </div>

            <div id="loginError" class="hidden text-xs bg-red-950/40 border border-[#e11b3a]/40 text-red-200 p-3 rounded-xl transition-all"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Kullanıcı Adı</label>
                    <input type="text" id="loginName" placeholder="Kullanıcı Adı" required 
                           class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:border-[#e11b3a] focus:ring-1 focus:ring-[#e11b3a] outline-none transition-all placeholder-slate-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Şifre</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required 
                           class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-900 focus:border-[#e11b3a] focus:ring-1 focus:ring-[#e11b3a] outline-none transition-all placeholder-slate-500">
                </div>
                
                <button type="submit" 
                        class="w-full bg-[#e11b3a] hover:bg-[#c51631] text-gray-900 font-medium py-3 rounded-xl transition-all text-sm shadow-lg shadow-[#e11b3a]/10 hover:shadow-[#c51631]/20 active:scale-[0.98]">
                    Giriş Yap
                </button>
            </form>
        </div>
    </div>

    <div id="panelContent" class="hidden">
        
        <nav class="bg-white border-b border-gray-200 px-6 py-4 mb-8 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 bg-[#e11b3a] rounded-full animate-pulse"></span>
                    <span class="text-lg font-bold text-gray-900 tracking-tight">İK Başvuru Takip Paneli</span>
                </div>
                <button id="adminLogoutBtn" class="text-sm font-medium text-[#e11b3a] hover:text-[#c51631] transition-colors px-3 py-1.5 rounded-lg hover:bg-red-50">
                    Sistemden Çıkış
                </button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 space-y-6">
            
            <div id="adminAlert" class="hidden p-4 rounded-xl text-sm font-medium border bg-red-950/40 border-red-800 text-red-200 transition-all duration-300"></div>

            <div class="bg-white border border-gray-200 rounded-2xl p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-4 shadow-md">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Arama (Ad, Soyad veya Pozisyon)</label>
                    <input type="text" id="searchBar" placeholder="Adaylarda ara..." class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Pozisyon Filtresi</label>
                    <select id="filterPosition" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all cursor-pointer">
                        <option value="">Tüm Pozisyonlar</option>
                        <option value="Android">Android Programları</option>
                        <option value="Embedded">Gömülü Sistemler</option>
                        <option value="Backend">Backend Pozisyonları</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Durum Filtresi</label>
                    <select id="filterStatus" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all cursor-pointer">
                        <option value="">Tüm Durumlar</option>
                        <option value="Applied">Applied (Yeni Başvuru)</option>
                        <option value="Under_Review">Under Review (İncelemede)</option>
                        <option value="Accepted">Accepted (Kabul Edildi)</option>
                        <option value="Rejected">Rejected (Reddedildi)</option>
                    </select>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-md">
                <div class="hidden md:block overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-[11px] font-bold text-gray-500 uppercase tracking-wider">
                                <th class="px-6 py-4">Aday Bilgisi</th>
                                <th class="px-6 py-4">Pozisyon / Departman</th>
                                <th class="px-6 py-4">Deneyim</th>
                                <th class="px-6 py-4">Durum</th>
                                <th class="px-6 py-4">Özgeçmiş</th>
                            </tr>
                        </thead>
                        <tbody id="desktopTableBody" class="divide-y divide-gray-200 text-sm text-gray-700"></tbody>
                    </table>
                </div>

                <div id="mobileCardsContainer" class="block md:hidden p-4 space-y-4"></div>

                <div id="emptyState" class="hidden p-12 text-center text-gray-500 text-sm font-medium">
                    Kriterlere uygun başvuru kaydı bulunamadı.
                </div>
            </div>
        </main>
    </div>

    <script>
        const BASE_URL = window.location.origin;
        const DEPARTMENT_LABELS = {
            embedded: "Gömülü Sistemler",
            backend: "Backend",
            frontend: "Frontend",
            security: "Siber Güvenlik",
            infrastructure: "Sistem ve Altyapı",
            product: "Ürün Yönetimi",
            people_ops: "İnsan Kaynakları"
        };

        // DOM Elemanları (Auth)
        const authGate = document.getElementById("authGate");
        const panelContent = document.getElementById("panelContent");
        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");
        const adminLogoutBtn = document.getElementById("adminLogoutBtn");

        // DOM Elemanları (Veri & Filtre)
        const desktopTableBody = document.getElementById("desktopTableBody");
        const mobileCardsContainer = document.getElementById("mobileCardsContainer");
        const emptyState = document.getElementById("emptyState");
        const adminAlert = document.getElementById("adminAlert");
        const searchBar = document.getElementById("searchBar");
        const filterPosition = document.getElementById("filterPosition");
        const filterStatus = document.getElementById("filterStatus");

        // State & Cache
        let allApplications = [];  
        let applicantCache = {};   

        function showAdminError(text) {
            adminAlert.textContent = text;
            adminAlert.classList.remove("hidden");
        }

        function departmentLabel(value) {
            if (!value) return "-";
            return DEPARTMENT_LABELS[value] || value;
        }

        // --- AUTH KONTROLÜ ---
        function checkAdminAuth() {
            const token = localStorage.getItem("admin_token");
            if (!token) {
                panelContent.classList.add("hidden");
                authGate.classList.remove("hidden");
            } else {
                authGate.classList.add("hidden");
                panelContent.classList.remove("hidden");
                loadDashboardData(); 
            }
        }

        // --- GERÇEK API TABANLI GİRİŞ TETİKLEYİCİSİ ---
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginError.classList.add("hidden");
            
            const login_name = document.getElementById("loginName").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${BASE_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ login_name, password })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Giriş bilgileri hatalı.");
                }

                const data = await res.json();
                localStorage.setItem("admin_token", data.access_token);
                
                loginForm.reset();
                checkAdminAuth(); 

            } catch (error) {
                loginError.textContent = error.message;
                loginError.classList.remove("hidden");
            }
        });

        // --- OPTİMİZE VERİ ÇEKME MOTORU ---
        async function loadDashboardData() {
            const token = localStorage.getItem("admin_token");
            adminAlert.classList.add("hidden");

            try {
                const appRes = await fetch(`${BASE_URL}/applications/`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!appRes.ok) throw new Error(`Başvurular çekilemedi. Durum: ${appRes.status}`);
                allApplications = await appRes.json();

                const uniqueApplicantIds = [...new Set(allApplications.map(app => app.applicant_id))];

                const applicantPromises = uniqueApplicantIds.map(async (id) => {
                    if (applicantCache[id]) return; 

                    try {
                        const applicantRes = await fetch(`${BASE_URL}/applicants/${id}`, {
                            method: "GET",
                            headers: { "Authorization": `Bearer ${token}` }
                        });
                        if (applicantRes.ok) {
                            applicantCache[id] = await applicantRes.json();
                        }
                    } catch (err) {
                        console.error(`Aday ID ${id} çekilirken hata:`, err);
                    }
                });

                await Promise.all(applicantPromises);
                renderTable();

            } catch (error) {
                showAdminError(`Sistem Hatası: ${error.message}`);
            }
        }

        // --- DİNAMİK RENDER MOTORU ---
        function renderTable() {
            const searchTerm = searchBar.value.toLowerCase().trim();
            const posFilter = filterPosition.value; 
            const statusFilter = filterStatus.value; 

            const filtered = allApplications.filter(app => {
                const applicant = applicantCache[app.applicant_id] || { first_name: "Bilinmeyen", last_name: "Aday" };
                const fullName = `${applicant.first_name} ${applicant.last_name}`.toLowerCase();
                const positionStr = app.position.toLowerCase();

                const matchesSearch = fullName.includes(searchTerm) || positionStr.includes(searchTerm);
                const matchesPosition = !posFilter || app.position.includes(posFilter);
                const matchesStatus = !statusFilter || app.status === statusFilter;

                return matchesSearch && matchesPosition && matchesStatus;
            });

            desktopTableBody.innerHTML = "";
            mobileCardsContainer.innerHTML = "";

            if (filtered.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            filtered.forEach(app => {
                const applicant = applicantCache[app.applicant_id] || { first_name: "Bilinmeyen", last_name: "Aday", email: "-" };
                const createdDate = app.created_at ? new Date(app.created_at).toLocaleDateString("tr-TR") : "-";

                // MASAÜSTÜ
                const desktopRow = document.createElement("tr");
                desktopRow.className = "hover:bg-red-50 transition-colors border-b border-gray-200/50";
                desktopRow.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="font-semibold text-gray-900">${applicant.first_name} ${applicant.last_name}</div>
                        <div class="text-xs text-gray-500">${applicant.email}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-sm font-medium text-gray-800">${app.position}</div>
                        <div class="text-xs text-gray-500">${departmentLabel(app.department)}</div>
                    </td>
                    <td class="px-6 py-4 text-gray-500 text-xs">${app.experience_years} Yıl</td>
                    <td class="px-6 py-4">
                        <select data-id="${app.id}" class="status-select bg-white border border-gray-200 rounded-lg px-2 py-1 text-xs text-gray-800 focus:ring-1 focus:ring-[#e11b3a] outline-none cursor-pointer">
                            <option value="Applied" ${app.status === 'Applied' ? 'selected' : ''}>Applied</option>
                            <option value="Under_Review" ${app.status === 'Under_Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Accepted" ${app.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
                            <option value="Rejected" ${app.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                    <td class="px-6 py-4" id="cv-desk-${app.id}"></td>
                `;
                desktopTableBody.appendChild(desktopRow);

                // MOBİL
                const mobileCard = document.createElement("div");
                mobileCard.className = "bg-white border border-gray-200 p-4 rounded-xl space-y-3 shadow-sm";
                mobileCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold text-gray-900 text-base">${applicant.first_name} ${applicant.last_name}</div>
                            <div class="text-xs text-gray-500">${applicant.email}</div>
                        </div>
                        <span class="text-[10px] bg-red-100 text-gray-700 px-2 py-0.5 rounded-full">${createdDate}</span>
                    </div>
                    <div class="text-xs bg-white/50 p-2 rounded-lg border border-gray-200 space-y-1">
                        <div><span class="text-gray-500">Pozisyon:</span> <span class="text-gray-800 font-medium">${app.position}</span></div>
                        <div><span class="text-gray-500">Departman:</span> <span class="text-gray-700">${departmentLabel(app.department)}</span></div>
                        <div><span class="text-gray-500">Deneyim:</span> <span class="text-gray-500">${app.experience_years} Yıl</span></div>
                    </div>
                    <div class="flex items-center justify-between gap-2 pt-1">
                        <select data-id="${app.id}" class="status-select bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-xs text-gray-800 focus:ring-1 focus:ring-[#e11b3a] outline-none w-1/2 cursor-pointer">
                            <option value="Applied" ${app.status === 'Applied' ? 'selected' : ''}>Applied</option>
                            <option value="Under_Review" ${app.status === 'Under_Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Accepted" ${app.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
                            <option value="Rejected" ${app.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                        <div id="cv-mob-${app.id}" class="w-1/2 text-right"></div>
                    </div>
                `;
                mobileCardsContainer.appendChild(mobileCard);

                // CV KOŞULU
                if (app.cv_url) {
                    const btnHtml = `<button onclick="downloadCV(${app.id})" class="text-xs font-semibold text-[#e11b3a] hover:text-[#c51631] underline transition-colors">CV İndir</button>`;
                    document.getElementById(`cv-desk-${app.id}`).innerHTML = btnHtml;
                    document.getElementById(`cv-mob-${app.id}`).innerHTML = btnHtml;
                } else {
                    const noCvHtml = `<span class="text-xs text-gray-500 italic">CV Yok</span>`;
                    document.getElementById(`cv-desk-${app.id}`).innerHTML = noCvHtml;
                    document.getElementById(`cv-mob-${app.id}`).innerHTML = noCvHtml;
                }
            });

            document.querySelectorAll(".status-select").forEach(select => {
                select.addEventListener("change", (e) => {
                    const appId = e.target.getAttribute("data-id");
                    const newStatus = e.target.value;
                    updateApplicationStatus(appId, newStatus);
                });
            });
        }

        // --- PATCH: DURUM GÜNCELLEME MOTORU ---
        async function updateApplicationStatus(id, newStatus) {
            const token = localStorage.getItem("admin_token");
            adminAlert.classList.add("hidden");

            try {
                const res = await fetch(`${BASE_URL}/applications/${id}/status`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Statü güncellenemedi.");
                }

                const appIndex = allApplications.findIndex(app => app.id == id);
                if (appIndex !== -1) {
                    allApplications[appIndex].status = newStatus;
                }
                renderTable();

            } catch (error) {
                showAdminError(`Güncelleme Hatası: ${error.message}`);
                loadDashboardData();
            }
        }

        // --- BLOB: CV İNDİRME MOTORU ---
        async function downloadCV(id) {
            const token = localStorage.getItem("admin_token");
            adminAlert.classList.add("hidden");

            try {
                const res = await fetch(`${BASE_URL}/applications/${id}/cv`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Dosya çekilemedi veya yetki yetersiz.");

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `candidate_cv_${id}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

            } catch (error) {
                showAdminError(`CV İndirme Hatası: ${error.message}`);
            }
        }

        // Aramalar ve Filtreler
        searchBar.addEventListener("input", renderTable);
        filterPosition.addEventListener("change", renderTable);
        filterStatus.addEventListener("change", renderTable);

        // Çıkış Butonu
        adminLogoutBtn.addEventListener("click", () => {
            localStorage.removeItem("admin_token");
            allApplications = []; 
            checkAdminAuth();
        });

        // DOM yüklendiğinde çalıştır
        document.addEventListener("DOMContentLoaded", checkAdminAuth);
    </script>
</body>
</html>
