<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aday Başvuru Formu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 mb-8 sticky top-0 z-40 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <span class="text-lg font-bold text-gray-900 tracking-tight">Kariyer Platformu</span>
            <button id="logoutBtn" class="text-sm font-medium text-[#e11b3a] hover:text-[#c51631] transition-colors">
                Oturumu Kapat
            </button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4">
        
        <div id="statusAlert" class="hidden"></div>

        <div id="formContainer" class="bg-white border border-gray-200 rounded-2xl p-6 md:p-8 shadow-sm space-y-6">
            <div class="border-b border-gray-100 pb-4">
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">İş Başvuru Formu</h1>
                <p class="text-sm text-gray-500 mt-1">Lütfen aşağıdaki bilgileri eksiksiz doldurunuz.</p>
            </div>

            <form id="mainApplyForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Adı <span class="text-red-500">*</span></label>
                        <input type="text" id="firstName" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Soyadı <span class="text-red-500">*</span></label>
                        <input type="text" id="lastName" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">E-Posta Adresi <span class="text-red-500">*</span></label>
                    <input type="email" id="email" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Başvurulacak Pozisyon <span class="text-red-500">*</span></label>
                        <select id="position" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none cursor-pointer">
                            <option value="Android Developer">Android Geliştirici</option>
                            <option value="Embedded Systems Engineer">Gömülü Sistemler Mühendisi</option>
                            <option value="Backend Developer">Backend Geliştirici</option>
                            <option value="Android Intern">Android Stajyeri</option>
                            <option value="Embedded Intern">Gömülü Sistemler Stajyeri</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Departman <span class="text-red-500">*</span></label>
                        <select id="companyDepartment" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none cursor-pointer">
                            <option value="embedded">Gömülü Sistemler</option>
                            <option value="backend">Backend</option>
                            <option value="frontend">Frontend</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Toplam Deneyim (Yıl) <span class="text-red-500">*</span></label>
                    <input type="number" id="experience" min="0" value="0" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all">
                </div>

                <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 space-y-4">
                    <h3 class="text-sm font-semibold text-gray-800">Eğitim Bilgileri</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label id="universityLabel" class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Üniversite</label>
                            <input type="text" id="university" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-1 focus:ring-[#e11b3a] outline-none">
                        </div>
                        <div>
                            <label id="uniDeptLabel" class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Bölüm</label>
                            <input type="text" id="uniDepartment" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-1 focus:ring-[#e11b3a] outline-none">
                        </div>
                        <div>
                            <label id="gradYearLabel" class="block text-[11px] font-semibold text-gray-500 uppercase mb-1">Mezuniyet Yılı</label>
                            <input type="number" id="gradYear" class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-1 focus:ring-[#e11b3a] outline-none">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Özgeçmiş Yükle (PDF, Max 5MB)</label>
                    <div class="flex items-center gap-3">
                        <label class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm font-medium px-4 py-2.5 rounded-xl border border-gray-300 cursor-pointer transition-colors">
                            Dosya Seç
                            <input type="file" id="cvFile" accept=".pdf" class="hidden">
                        </label>
                        <span id="cvFileName" class="hidden text-xs text-emerald-700 font-medium"></span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1.5">Eklemek İstedikleriniz (Notlar)</label>
                    <textarea id="notes" maxlength="500" rows="3" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-[#e11b3a] outline-none transition-all resize-none"></textarea>
                    <div class="text-right text-[10px] text-gray-400 mt-1"><span id="notesCount">0</span> / 500</div>
                </div>

                <div class="border-t border-gray-100 pt-4 space-y-3">
                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="kvkkGeneral" required class="w-4 h-4 mt-0.5 accent-[#e11b3a]">
                        <span class="text-xs text-gray-600 leading-relaxed">
                            Başvuru süreçlerimin yürütülmesi amacıyla kişisel verilerimin işlenmesine ilişkin <a href="#" class="text-[#e11b3a] underline">Aydınlatma Metnini</a> okudum ve onaylıyorum. <span class="text-red-500">*</span>
                        </span>
                    </label>

                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="marketingConsent" class="w-4 h-4 mt-0.5 accent-[#e11b3a]">
                        <span class="text-xs text-gray-600 leading-relaxed">
                            Gelecekte oluşabilecek uygun pozisyonlar için tarafımla iletişime geçilmesine ve bilgilendirme iletileri gönderilmesine izin veriyorum. (Opsiyonel)
                        </span>
                    </label>
                </div>

                <button type="submit" id="submitApplyBtn" class="w-full bg-[#e11b3a] hover:bg-[#c51631] text-white font-medium py-3 rounded-xl transition-all text-sm shadow-md flex items-center justify-center gap-2">
                    <span>Başvuruyu Tamamla</span>
                </button>
            </form>
        </div>

        <div id="successContainer" class="hidden bg-white border border-gray-200 rounded-2xl p-12 text-center shadow-sm space-y-4">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto border border-emerald-100 text-2xl font-bold">
                ✓
            </div>
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Başvurunuz Alındı!</h2>
            <p class="text-sm text-gray-500 max-w-md mx-auto">
                Kişisel bilgileriniz, başvuru detaylarınız ve KVKK onaylarınız sisteme başarıyla mühürlendi. İnceleme süreçlerini profil sayfanızdan takip edebilirsiniz.
            </p>
        </div>

    </main>

    <script>
        const BASE_URL = "http://localhost:8000";
        const token = localStorage.getItem("auth_token");

        if (!token) {
            window.location.href = "/static/index.html";
        }

        if (localStorage.getItem("applied") === "true") {
            document.getElementById("formContainer").classList.add("hidden");
            document.getElementById("successContainer").classList.remove("hidden");
        }

        const statusAlert    = document.getElementById("statusAlert");
        const submitBtn      = document.getElementById("submitApplyBtn");
        const positionSelect = document.getElementById("position");
        const universityInput  = document.getElementById("university");
        const uniDeptInput     = document.getElementById("uniDepartment");
        const gradYearInput    = document.getElementById("gradYear");
        const universityLabel  = document.getElementById("universityLabel");
        const uniDeptLabel     = document.getElementById("uniDeptLabel");
        const gradYearLabel    = document.getElementById("gradYearLabel");
        const cvFileInput      = document.getElementById("cvFile");
        const cvFileName       = document.getElementById("cvFileName");
        const notesTextarea    = document.getElementById("notes");
        const notesCount       = document.getElementById("notesCount");

        function showAlert(message, type = "error") {
            statusAlert.className = "mb-6 p-4 rounded-xl text-sm font-medium border";
            if (type === "error") {
                statusAlert.classList.add("bg-red-50", "text-red-700", "border-red-200");
            } else if (type === "success") {
                statusAlert.classList.add("bg-emerald-50", "text-emerald-700", "border-emerald-200");
            } else {
                statusAlert.classList.add("bg-blue-50", "text-blue-700", "border-blue-200");
            }
            statusAlert.textContent = message;
            statusAlert.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function hideAlert() {
            statusAlert.className = "hidden";
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                submitBtn.innerHTML = `
                    <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    <span>Gönderiliyor...</span>
                `;
            } else {
                submitBtn.innerHTML = `<span>Başvuruyu Tamamla</span>`;
            }
        }

        function isInternPosition(value) {
            return value.toLowerCase().includes("intern");
        }

        function updateEducationFields() {
            const pos = positionSelect.value;
            const isIntern = isInternPosition(pos);

            universityInput.required = isIntern;
            uniDeptInput.required    = isIntern;
            gradYearInput.required   = isIntern;

            universityLabel.innerHTML = "Üniversite" + (isIntern ? ' <span class="text-red-500">*</span>' : '');
            uniDeptLabel.innerHTML    = "Bölüm"      + (isIntern ? ' <span class="text-red-500">*</span>' : '');
            gradYearLabel.innerHTML   = "Mezuniyet / Beklenen Yıl" + (isIntern ? ' <span class="text-red-500">*</span>' : '');
        }

        positionSelect.addEventListener("change", updateEducationFields);

        cvFileInput.addEventListener("change", () => {
            const file = cvFileInput.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    showAlert("Dosya boyutu 5MB sınırını aşıyor. Lütfen daha küçük bir dosya seçin.");
                    cvFileInput.value = "";
                    cvFileName.classList.add("hidden");
                    return;
                }
                cvFileName.textContent = "✓ " + file.name;
                cvFileName.classList.remove("hidden");
                hideAlert();
            }
        });

        notesTextarea.addEventListener("input", () => {
            notesCount.textContent = notesTextarea.value.length;
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "/static/index.html";
        });

        document.getElementById("mainApplyForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            if (!document.getElementById("kvkkGeneral").checked) {
                showAlert("Devam etmek için KVKK metnini onaylamanız gerekmektedir.");
                return;
            }

            const firstName  = document.getElementById("firstName").value.trim();
            const lastName   = document.getElementById("lastName").value.trim();
            const email      = document.getElementById("email").value.trim();
            const position   = positionSelect.value;
            const department = document.getElementById("companyDepartment").value;

            if (!firstName || !lastName || !email || !position || !department) {
                showAlert("Lütfen tüm zorunlu alanları doldurunuz.");
                return;
            }

            if (isInternPosition(position)) {
                if (!universityInput.value.trim() || !uniDeptInput.value.trim() || !gradYearInput.value) {
                    showAlert("Staj başvurusu için üniversite, bölüm ve mezuniyet yılı zorunludur.");
                    return;
                }
            }

            setLoading(true);
            let applicantId = null;

            try {
                // ── ADIM 1: Aday Kaydı / Kontrolü ───────────────────────
                showAlert("Adım 1/4: Kişisel bilgiler kaydediliyor...", "info");

                const applicantRes = await fetch(`${BASE_URL}/applicants/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        first_name:            firstName,
                        last_name:             lastName,
                        email:                 email,
                        phone:                 localStorage.getItem("phone") || "",
                        university:            universityInput.value.trim() || null,
                        university_department: uniDeptInput.value.trim()    || null,
                        graduation_year:       gradYearInput.value ? parseInt(gradYearInput.value) : null
                    })
                });

                const applicantData = await applicantRes.json();

                // 🌟 MÜKERRER KAYIT YAKALAYICI (409)
                if (applicantRes.status === 409) {
                    applicantId = applicantData.id || applicantData.detail?.id;
                    
                    if (!applicantId) {
                        const meRes = await fetch(`${BASE_URL}/applicants/me`, {
                            method: "GET",
                            headers: { "Authorization": `Bearer ${token}` }
                        });
                        if (meRes.ok) {
                            const meData = await meRes.json();
                            applicantId = meData.id;
                        }
                    }
                } else if (!applicantRes.ok) {
                    throw new Error(`Adım 1 hatası: ${applicantData.detail || "Aday kaydı oluşturulamadı."}`);
                } else {
                    applicantId = applicantData.id;
                }

                if (!applicantId) {
                    throw new Error("Aday profil doğrulaması başarısız oldu.");
                }

                // ── ADIM 2: Başvuru Kaydı ──────────────────────────────
                showAlert("Adım 2/4: Başvuru bilgileri kaydediliyor...", "info");

                const applicationRes = await fetch(`${BASE_URL}/applications/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        applicant_id:     applicantId,
                        position:         position,
                        department:       department,
                        experience_years: parseInt(document.getElementById("experience").value) || 0,
                        notes:            notesTextarea.value.trim() || null
                    })
                });

                const applicationData = await applicationRes.json();

                if (!applicationRes.ok) {
                    throw new Error(`Adım 2 hatası: ${applicationData.detail || "Başvuru kaydı oluşturulamadı."}`);
                }

                const applicationId = applicationData.id;

                // ── ADIM 3: CV Yükleme (Opsiyonel) ──────────────────────
                const cvFile = cvFileInput.files[0];
                if (cvFile) {
                    showAlert("Adım 3/4: CV yükleniyor...", "info");

                    const formData = new FormData();
                    formData.append("file", cvFile);

                    const cvRes = await fetch(`${BASE_URL}/applications/${applicationId}/upload-cv`, {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}` },
                        body: formData
                    });

                    if (!cvRes.ok) {
                        showAlert("Başvurunuz alındı ancak CV yüklenemedi. İK ile görüşünüz.", "error");
                        await new Promise(r => setTimeout(r, 1500));
                    }
                }

                // ── ADIM 4: KVKK & Rıza Kayıtlarının Mühürlenmesi ───────
                showAlert("Adım 4/4: İzinleriniz ve rıza beyanlarınız mühürleniyor...", "info");
                
                const consentPromises = [];

                // 1. Genel KVKK Onayı
                consentPromises.push(
                    fetch(`${BASE_URL}/consents/`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            applicant_id: applicantId,
                            consent_type: "kvkk",
                            consent_text_version: "v2026.1"
                        })
                    })
                );

                // 2. Pazarlama / İletişim İzni
                const marketingConsentCheckbox = document.getElementById("marketingConsent");
                if (marketingConsentCheckbox && marketingConsentCheckbox.checked) {
                    consentPromises.push(
                        fetch(`${BASE_URL}/consents/`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                applicant_id: applicantId,
                                consent_type: "communication",
                                consent_text_version: "v2026.1"
                            })
                        })
                    );
                }

                await Promise.all(consentPromises);

                // ── BAŞARI TETİKLEMESİ ──────────────────────────────────
                localStorage.setItem("applied", "true");
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("successContainer").classList.remove("hidden");
                window.scrollTo({ top: 0, behavior: "smooth" });

            } catch (error) {
                showAlert(error.message);
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
